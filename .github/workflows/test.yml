name: CPU classroom checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m reaction_knowledge_lab demo --workdir runs/ci
      - run: python -m reaction_knowledge_lab verify --workdir runs/ci
      - run: python -m reaction_knowledge_lab batch-demo --workdir runs/ci-batch
      - run: python -m reaction_knowledge_lab batch-verify --workdir runs/ci-batch
      - run: python scripts/verify_student_setup.py --output runs/ci-student-check
      - run: python scripts/run_notebooks.py --workdir runs/ci-notebooks --output-dir runs/ci-notebooks-executed
